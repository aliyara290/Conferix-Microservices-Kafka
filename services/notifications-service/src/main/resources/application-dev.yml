# Development Profile Configuration

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/notification_db?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        
  kafka:
    bootstrap-servers: localhost:9092
    
  mail:
    host: smtp.gmail.com
    port: 587
    
  data:
    redis:
      host: localhost
      port: 6379
      
# Notification config pour dev
notification:
  email:
    mock: true  # Mode simulation en dev
    enabled: true
    
# Logging plus verbeux en dev
logging:
  level:
    root: INFO
    com.aliyara.notificationsservice: DEBUG
    org.springframework.kafka: DEBUG
    org.springframework.mail: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
