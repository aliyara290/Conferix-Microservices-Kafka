# Production Profile Configuration

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:notification_db}?useSSL=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      
# Notification config pour production
notification:
  email:
    mock: false  # Envoi réel en production
    enabled: true
    from: ${NOTIFICATION_EMAIL_FROM}
    
# Logging production
logging:
  level:
    root: WARN
    com.aliyara.notificationsservice: INFO
    org.springframework.kafka: WARN
    org.springframework.mail: INFO
    org.hibernate.SQL: WARN
    
# Eureka
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://discovery-service:8761/eureka/}
      
# Management endpoints sécurisés en production
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
